name: Validate QR menu

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check public/assets/js/app.js
          node --check public/assets/js/i18n.js
          node --check tools/build.mjs
          node --check tools/audit.mjs

      - name: Audit menu data
        run: npm run audit

      - name: Build static pages
        run: npm run build
